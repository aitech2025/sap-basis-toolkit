services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      TIMESCALEDB_TELEMETRY: "off"
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}
    volumes:
      - sentinel-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        HANA_CLIENT: ${HANA_CLIENT:-true}
    command: ["alembic", "upgrade", "head"]
    environment: &app-environment
      DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/sentinel
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?Set API_AUTH_TOKEN in the project .env file}
      ALLOWED_TARGET_HOSTS: ${ALLOWED_TARGET_HOSTS:?Set ALLOWED_TARGET_HOSTS}
      ALLOWED_TARGET_CIDRS: ${ALLOWED_TARGET_CIDRS:-}
      ALLOWED_TARGET_PORTS: ${ALLOWED_TARGET_PORTS:-443}
      CHECK_INTERVAL_MINUTES: ${CHECK_INTERVAL_MINUTES:-360}
      CERTIFICATE_TIMEOUT_SECONDS: ${CERTIFICATE_TIMEOUT_SECONDS:-8}
      DEFAULT_WARNING_DAYS: ${DEFAULT_WARNING_DAYS:-30}
      ALERT_THRESHOLDS_DAYS: ${ALERT_THRESHOLDS_DAYS:-90,60,30,14,7}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_WEBHOOK_FORMAT: ${ALERT_WEBHOOK_FORMAT:-generic}
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY:-}
      GROWTH_ALERT_DAYS: ${GROWTH_ALERT_DAYS:-30}
      GROWTH_CAPACITY_THRESHOLD_PCT: ${GROWTH_CAPACITY_THRESHOLD_PCT:-90}
      GROWTH_EVAL_INTERVAL_MINUTES: ${GROWTH_EVAL_INTERVAL_MINUTES:-1440}
      DORMANT_USER_DAYS: ${DORMANT_USER_DAYS:-90}
      PROTECTED_USERS: ${PROTECTED_USERS:-SAP*,DDIC,TMSADM,EARLYWATCH,SAPCPIC}
      PROTECTED_TABLES: ${PROTECTED_TABLES:-T000,USR01,USR02,USR04,UST04,AGR_USERS,RFCDES,TBTCO,TBTCP,TVARVC,PRGN_CUST,SSM_CUST}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      PROFILE_OVERRIDES_FILE: ${PROFILE_OVERRIDES_FILE:-}
      JOB_LONG_RUNNING_MINUTES: ${JOB_LONG_RUNNING_MINUTES:-120}
      LOCK_WARNING_MINUTES: ${LOCK_WARNING_MINUTES:-60}
      LOCK_CRITICAL_MINUTES: ${LOCK_CRITICAL_MINUTES:-240}
      OPS_DATA_STALE_HOURS: ${OPS_DATA_STALE_HOURS:-24}
      OPS_RETENTION_DAYS: ${OPS_RETENTION_DAYS:-90}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the project .env file}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COLLECTOR_TICK_SECONDS: ${COLLECTOR_TICK_SECONDS:-15}
      COLLECTOR_TIMEOUT_SECONDS: ${COLLECTOR_TIMEOUT_SECONDS:-15}
      COLLECTOR_MAX_PARALLEL: ${COLLECTOR_MAX_PARALLEL:-16}
      SAPCONTROL_INSTANCE_PARALLEL: ${SAPCONTROL_INSTANCE_PARALLEL:-4}
      CERT_CHECK_PARALLEL: ${CERT_CHECK_PARALLEL:-8}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      INTELLIGENCE_CACHE_SECONDS: ${INTELLIGENCE_CACHE_SECONDS:-60}
      WP_LONG_RUNNING_SECONDS: ${WP_LONG_RUNNING_SECONDS:-1800}
      METRIC_RETENTION_DAYS: ${METRIC_RETENTION_DAYS:-30}
      SNAPSHOT_RETENTION_DAYS: ${SNAPSHOT_RETENTION_DAYS:-7}
      SNAPSHOT_FULL_RESOLUTION_HOURS: ${SNAPSHOT_FULL_RESOLUTION_HOURS:-24}
      QUERY_OVERRIDES_FILE: ${QUERY_OVERRIDES_FILE:-}
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        HANA_CLIENT: ${HANA_CLIENT:-true}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-environment
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        HANA_CLIENT: ${HANA_CLIENT:-true}
    command: ["python", "-m", "app.worker"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  sentinel-postgres:
