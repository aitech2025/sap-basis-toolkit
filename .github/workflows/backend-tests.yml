name: Backend tests
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - name: Verify fresh database migration
        run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./migration-test.db
      - run: pytest -q
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-test-password
          API_AUTH_TOKEN: ci-test-api-token
          ALLOWED_TARGET_HOSTS: ci.example.test
          ALLOWED_TARGET_CIDRS: ""
          ALLOWED_TARGET_PORTS: "443"
        run: docker compose config -q
      - name: Build backend image
        run: docker build -t sap-basis-sentinel-ci ./backend
